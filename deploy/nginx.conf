# Copied to /etc/nginx/templates/ so the image's envsubst fills ${CSP_CONNECT_SRC} only;
# nginx variables like $uri are left alone because they are not defined in the environment.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects keep the scheme and host the proxy (Traefik) received.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    # Hashed build output: safe to cache forever.
    location /assets/ {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        location ~* \.ttf$ {
            default_type font/ttf;
        }
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /admin {
        return 301 /admin/;
    }

    # Admin SPA fallback: deep links boot the admin entry, never the portal.
    location /admin/ {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # Portal SPA fallback. HTML is revalidated on every load so a deploy is picked up at once.
    location / {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
